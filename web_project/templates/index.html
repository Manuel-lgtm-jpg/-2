<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>在线问诊预约系统</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <header class="hero">
            <h1>🏥 在线问诊预约系统</h1>
            <p class="subtitle">请填写以下信息，预约您的问诊时间</p>
        </header>

        <form id="booking-form" class="card">
            <div class="field">
                <label for="name">患者姓名 <span class="req">*</span></label>
                <input type="text" id="name" name="name" placeholder="请输入真实姓名" required>
            </div>

            <div class="field">
                <label for="phone">手机号 <span class="req">*</span></label>
                <input type="tel" id="phone" name="phone" placeholder="请输入手机号" required>
            </div>

            <div class="field">
                <label for="department">就诊科室 <span class="req">*</span></label>
                <select id="department" name="department" required>
                    <option value="">请选择科室</option>
                    <option>内科</option>
                    <option>外科</option>
                    <option>儿科</option>
                    <option>妇科</option>
                    <option>骨科</option>
                    <option>眼科</option>
                    <option>口腔科</option>
                    <option>皮肤科</option>
                    <option>耳鼻喉科</option>
                    <option>中医科</option>
                </select>
            </div>

            <div class="field">
                <label for="doctor">指定医生（选填）</label>
                <input type="text" id="doctor" name="doctor" placeholder="不指定可留空">
            </div>

            <div class="field">
                <label for="appt_date">就诊日期 <span class="req">*</span></label>
                <input type="date" id="appt_date" name="appt_date" required>
            </div>

            <div class="field">
                <label for="timeslot">时间段 <span class="req">*</span></label>
                <select id="timeslot" name="timeslot" required>
                    <option value="">请选择时间段</option>
                    <option>上午 08:00 - 09:00</option>
                    <option>上午 09:00 - 10:00</option>
                    <option>上午 10:00 - 11:00</option>
                    <option>下午 14:00 - 15:00</option>
                    <option>下午 15:00 - 16:00</option>
                    <option>下午 16:00 - 17:00</option>
                    <option>晚间 19:00 - 20:00</option>
                </select>
            </div>

            <div class="field">
                <label for="symptoms">症状描述（选填）</label>
                <textarea id="symptoms" name="symptoms" rows="3" placeholder="简要描述您的不适症状"></textarea>
            </div>

            <button type="submit" class="btn">提交预约</button>
            <a href="/appointments" class="link">查看预约列表 →</a>
            <p id="msg" class="msg"></p>
        </form>
    </div>

    <script>
        const form = document.getElementById('booking-form');
        const msg = document.getElementById('msg');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const fd = new FormData(form);
            msg.textContent = '提交中...';
            msg.className = 'msg';
            try {
                const res = await fetch('/api/appointments', { method: 'POST', body: fd });
                const data = await res.json();
                if (res.ok) {
                    msg.textContent = '✅ ' + data.message;
                    msg.className = 'msg ok';
                    form.reset();
                    setTimeout(() => { window.location.href = '/appointments'; }, 900);
                } else {
                    msg.textContent = '❌ ' + (data.error || '提交失败');
                    msg.className = 'msg err';
                }
            } catch (err) {
                msg.textContent = '❌ 网络错误，请重试';
                msg.className = 'msg err';
            }
        });
    </script>
</body>
</html>
